name: Deploy to Production

on:
  push:
    branches: [main, deploy-clean]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build frontend assets
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi
          npm run build

      - name: Upload built assets to server
        env:
          DEPLOY_WEBHOOK_SECRET: ${{ secrets.DEPLOY_WEBHOOK_SECRET }}
        run: |
          tar -czf assets.tar.gz -C public build
          SIG="sha256=$(openssl dgst -sha256 -hmac "$DEPLOY_WEBHOOK_SECRET" assets.tar.gz | awk '{print $2}')"
          curl -f -s -X POST https://pos.shuddhidham.com/webhook/assets \
            -H "Content-Type: application/octet-stream" \
            -H "X-Hub-Signature-256: $SIG" \
            --data-binary "@assets.tar.gz"

      - name: Trigger server deploy
        env:
          DEPLOY_WEBHOOK_SECRET: ${{ secrets.DEPLOY_WEBHOOK_SECRET }}
          BRANCH_REF: ${{ github.ref_name }}
        run: |
          BODY="{\"ref\":\"${BRANCH_REF}\"}"
          SIG="sha256=$(printf '%s' "$BODY" | openssl dgst -sha256 -hmac "$DEPLOY_WEBHOOK_SECRET" | awk '{print $2}')"
          curl -f -s -X POST https://pos.shuddhidham.com/webhook/deploy \
            -H "Content-Type: application/json" \
            -H "X-Hub-Signature-256: $SIG" \
            -d "$BODY"
